name: Test media enricher

on:
  push:
    paths:
      - "media_enricher.py"
      - "tests/test_media_enricher.py"
      - "requirements.txt"
      - ".github/workflows/enrich-video-media.yml"
      - ".github/workflows/test-media-enricher.yml"
  pull_request:
    paths:
      - "media_enricher.py"
      - "tests/test_media_enricher.py"
      - "requirements.txt"
      - ".github/workflows/enrich-video-media.yml"
      - ".github/workflows/test-media-enricher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-media-enricher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile worker
        run: python -m py_compile media_enricher.py
      - name: Run media extraction regression tests
        run: python -m unittest discover -s tests -v
