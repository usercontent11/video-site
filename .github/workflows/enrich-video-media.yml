name: Enrich video media

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Records per database batch (1-5000)"
        required: true
        default: "500"
        type: string
      concurrency:
        description: "Maximum concurrent page requests (1-100)"
        required: true
        default: "20"
        type: string
      max_videos:
        description: "Maximum videos for this run; 0 means no application-level limit"
        required: true
        default: "0"
        type: string
      dry_run:
        description: "Extract and report only; do not write to Neon"
        required: true
        default: true
        type: boolean
      refresh_existing:
        description: "Replace existing media paths only when a new validated URL is found"
        required: true
        default: false
        type: boolean
      video_id:
        description: "Optional: diagnose or process only one public.videos.id (for example 1193895)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: video-media-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_ORIGIN: https://mobilexh.live
      BATCH_SIZE: ${{ inputs.batch_size }}
      CONCURRENCY: ${{ inputs.concurrency }}
      MAX_VIDEOS: ${{ inputs.max_videos }}
      DRY_RUN: ${{ inputs.dry_run }}
      REFRESH_EXISTING: ${{ inputs.refresh_existing }}
      VIDEO_ID: ${{ inputs.video_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate code and regression tests
        run: |
          python -m py_compile media_enricher.py
          python -m unittest discover -s tests -v

      - name: Validate workflow settings
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Repository secret DATABASE_URL is not configured."
            exit 1
          fi
          for value in "$BATCH_SIZE" "$CONCURRENCY" "$MAX_VIDEOS"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::Batch size, concurrency, and max videos must be non-negative integers."
              exit 1
            fi
          done

      - name: Run media enrichment
        shell: bash
        run: |
          args=(--batch-size "$BATCH_SIZE" --concurrency "$CONCURRENCY" --max-videos "$MAX_VIDEOS")
          if [[ "$DRY_RUN" != "true" ]]; then
            args+=(--apply)
          fi
          if [[ "$REFRESH_EXISTING" == "true" ]]; then
            args+=(--refresh-existing)
          fi
          if [[ -n "$VIDEO_ID" ]]; then
            args+=(--video-id "$VIDEO_ID")
          fi
          python media_enricher.py "${args[@]}"
